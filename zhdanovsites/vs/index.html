<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ваш сайт сейчас и после | Zhdanov Sites</title>
<link rel="icon" href="/favicon.png">
<link rel="preload" href="/fonts/cormorant-garamond-cyrillic-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css?v=43">
<style>
body{margin:0;background:var(--bg,#121312);color:var(--ink,#f6efe2);font-family:var(--sans,system-ui)}
.v{max-width:1180px;margin:0 auto;padding:26px 18px 70px}
.v-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
.v-top a{color:var(--soft,#b9b4ab);text-decoration:none;font-size:15px}.v-brand{font:600 22px/1 var(--serif,Georgia,serif);color:var(--ink,#f6efe2)!important}
.v-eye{color:var(--gold,#e7b866);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}
.v h1{font:600 clamp(32px,5.4vw,52px)/1.08 var(--serif,Georgia,serif);margin:0 0 12px}
.v-lead{color:var(--soft,#b9b4ab);max-width:760px;font-size:17px;line-height:1.55;margin:0 0 22px}
.v-sw{display:inline-flex;border:1px solid var(--line,#2e2f2d);border-radius:999px;padding:4px;margin:0 0 14px}
.v-sw button{appearance:none;border:0;background:transparent;color:var(--soft,#b9b4ab);font:inherit;font-size:15px;padding:8px 16px;border-radius:999px;cursor:pointer;min-height:40px}
.v-sw button[aria-pressed=true]{background:var(--gold,#e7b866);color:#121312;font-weight:700}
.v-cmp{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line,#2e2f2d);background:#000;user-select:none;touch-action:pan-y;margin:0 auto}
.v-cmp.m{max-width:390px}
.v-cmp img{display:block;width:100%;height:auto}
.v-cmp .nw{position:absolute;inset:0;clip-path:inset(0 0 0 var(--x,50%))}
.v-cmp .nw img{height:100%;object-fit:cover;object-position:top}
.v-line{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;margin-left:-1px;background:var(--gold,#e7b866);pointer-events:none}
.v-knob{position:absolute;top:50%;left:var(--x,50%);width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--gold,#e7b866);color:#121312;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.4);pointer-events:none}
.v-tag{position:absolute;top:12px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(18,19,18,.82);color:var(--ink,#f6efe2)}.v-tag.l{left:12px}.v-tag.r{right:12px;background:var(--gold,#e7b866);color:#121312}
.v-range{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.v-range:focus-visible+.v-knob{outline:3px solid var(--gold2,#f3d69f);outline-offset:3px}
.v-links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0 0;font-size:15px}.v-links a{color:var(--soft,#b9b4ab)}
.v-h{font:600 28px/1.2 var(--serif,Georgia,serif);margin:40px 0 14px}
.v-met{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.v-m{background:var(--card,#1f201f);border:1px solid var(--line,#2e2f2d);border-radius:20px;padding:18px 20px}
.v-m span{display:block;color:var(--mute,#85827b);font-size:14px;margin-bottom:8px}
.v-m b{font:600 34px/1 var(--serif,Georgia,serif);color:var(--gold,#e7b866)}
.v-m s{color:var(--mute,#85827b);text-decoration:line-through;margin-right:8px;font-size:17px}
.v-m em{display:inline-block;margin-top:10px;font-style:normal;font-size:14px;color:#7fc98a;font-weight:700}
.v-ch{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.v-ch li{display:grid;grid-template-columns:24px 1fr;gap:10px;background:var(--card,#1f201f);border:1px solid var(--line,#2e2f2d);border-radius:16px;padding:14px 16px;font-size:16px}
.v-ch li::before{content:"✓";color:var(--gold,#e7b866);font-weight:700}
.v-note{color:var(--mute,#85827b);font-size:13px;margin-top:10px}
.v-cta{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap}
.v-cta .go{background:var(--gold,#e7b866);color:#121312;border-radius:999px;padding:12px 22px;text-decoration:none;font-size:16px;font-weight:700}
.v-cta .alt{appearance:none;border:1px solid var(--line,#2e2f2d);color:var(--ink,#f6efe2);background:transparent;border-radius:999px;padding:12px 22px;text-decoration:none;font-size:16px}
.v-err{background:var(--card,#1f201f);border:1px solid var(--line,#2e2f2d);border-radius:20px;padding:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="v" id="v" aria-live="polite">
  <div class="v-top"><a class="v-brand" href="/">Zhdanov Sites</a><a href="/#check">Проверить свой сайт →</a></div>
  <p class="v-lead">Загружаем сравнение…</p>
</main>
<script>
(function(){
'use strict';
var root=document.getElementById('v'),qs=new URLSearchParams(location.search),slug=(qs.get('c')||'').replace(/[^a-z0-9\-_]/gi,'');
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function times(k){var v=k>=10?Math.round(k):Math.round(k*10)/10;if(v%1)return num(v)+' раза';var a=v%10,b=v%100;return v+((a>=2&&a<=4&&(b<12||b>14))?' раза':' раз')}
function num(n){return String(n).replace('.',',')}
var top='<div class="v-top"><a class="v-brand" href="/">Zhdanov Sites</a><a href="/#check">Проверить свой сайт →</a></div>';
if(!slug){root.innerHTML=top+'<div class="v-err">Ссылка неполная: нет названия сравнения (?c=…).</div>';return}
fetch('data/'+slug+'.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(render).catch(function(){root.innerHTML=top+'<div class="v-err">Сравнение не найдено. Проверьте ссылку или напишите нам: <a href="https://t.me/ZhdanovOfficial" style="color:var(--gold,#e7b866)">@ZhdanovOfficial</a></div>'});
function render(d){
 document.title=d.client+': сайт сейчас и после | Zhdanov Sites';
 var hasM=d.old.m&&d.new.m;
 var h=top+'<p class="v-eye">'+esc(d.client)+'</p><h1>'+esc(d.title||'Ваш сайт сейчас и после')+'</h1>'+(d.lead?'<p class="v-lead">'+esc(d.lead)+'</p>':'');
 h+=(hasM?'<div class="v-sw" role="group" aria-label="Вид"><button type="button" data-v="d" aria-pressed="true">Компьютер</button><button type="button" data-v="m" aria-pressed="false">Телефон</button></div>':'');
 h+='<div class="v-cmp" id="cmp"><img id="io" alt="'+esc(d.old.label||'Сейчас')+': '+esc(d.old.url)+'"><div class="nw"><img id="in" alt="'+esc(d.new.label||'После')+': новый сайт"></div><span class="v-line" aria-hidden="true"></span><span class="v-tag l">'+esc(d.old.label||'Сейчас')+'</span><span class="v-tag r">'+esc(d.new.label||'После')+'</span><input class="v-range" id="rg" type="range" min="0" max="100" value="50" aria-label="Двигайте, чтобы сравнить старый и новый сайт"><span class="v-knob" aria-hidden="true">⇆</span></div>';
 h+='<div class="v-links"><a href="'+esc(d.old.url)+'" target="_blank" rel="noopener nofollow">Открыть нынешний сайт</a><a href="'+esc(d.new.url)+'" target="_blank" rel="noopener">Открыть новый сайт</a></div>';
 if(d.metrics&&d.metrics.length){
  h+='<h2 class="v-h">Цифры</h2><div class="v-met">'+d.metrics.map(function(m){var k=m.better==='less'?m.old/m.new:m.new/m.old,u=m.unit?' '+esc(m.unit):'';return '<div class="v-m"><span>'+esc(m.name)+'</span><s>'+num(m.old)+u+'</s><b>'+num(m.new)+u+'</b><br><em>'+(k>=1.5?(m.better==='less'?'в '+times(k)+' меньше':'в '+times(k)+' больше'):(m.better==='less'?'меньше':'больше'))+'</em></div>'}).join('')+'</div>'+(d.measured?'<p class="v-note">Замер: '+esc(d.measured)+'.</p>':'');
 }
 if(d.changes&&d.changes.length)h+='<h2 class="v-h">Что изменили</h2><ul class="v-ch">'+d.changes.map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ul>';
 h+='<div class="v-cta"><a class="go" href="'+esc(d.cta||'https://t.me/ZhdanovOfficial')+'" target="_blank" rel="noopener">Обсудить новый сайт</a><a class="alt" href="/#check">Проверить другой сайт</a><a class="alt" href="/style/">Подобрать стиль</a></div>';
 root.innerHTML=h;
 var cmp=document.getElementById('cmp'),rg=document.getElementById('rg'),io=document.getElementById('io'),inn=document.getElementById('in');
 function view(v){io.src=d.old[v];inn.src=d.new[v];cmp.classList.toggle('m',v==='m');document.querySelectorAll('.v-sw button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===v?'true':'false')})}
 function set(x){x=Math.max(0,Math.min(100,x));cmp.style.setProperty('--x',x+'%');rg.value=x}
 rg.addEventListener('input',function(){set(+rg.value)});
 var drag=false;function at(e){var r=cmp.getBoundingClientRect(),cx=(e.touches?e.touches[0].clientX:e.clientX);set((cx-r.left)/r.width*100)}
 cmp.addEventListener('pointerdown',function(e){drag=true;at(e)});window.addEventListener('pointermove',function(e){if(drag)at(e)});window.addEventListener('pointerup',function(){drag=false});
 document.querySelectorAll('.v-sw button').forEach(function(b){b.addEventListener('click',function(){view(b.dataset.v)})});
 view(window.innerWidth<700&&hasM?'m':'d');set(50);
 // подсказка: ползунок сам качнётся один раз
 var t=0,iv=setInterval(function(){t+=1;set(50+Math.sin(t/6)*18);if(t>38){clearInterval(iv);set(50)}},30);
 try{ym(114037897,'reachGoal','vs_view')}catch(e){}
}
})();
</script>
</body>
</html>
